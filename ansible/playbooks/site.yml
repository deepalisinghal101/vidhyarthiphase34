---
# Master Playbook for AWS DevOps Infrastructure configuration

- name: Apply common configurations to all servers
  hosts: kafka_brokers, kafka_ui
  become: yes
  roles:
    - common

- name: Install and configure Kafka KRaft Brokers
  hosts: kafka_brokers
  become: yes
  roles:
    - kafka

- name: Install and configure Kafka UI Control Panel
  hosts: kafka_ui
  become: yes
  roles:
    - kafka_ui
