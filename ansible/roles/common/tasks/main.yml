---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install common packages
  apt:
    name:
      - curl
      - gnupg
      - unzip
      - tar
      - apt-transport-https
      - ca-certificates
    state: present
  become: yes

- name: Install OpenJDK
  apt:
    name: "{{ java_packages }}"
    state: present
  become: yes
