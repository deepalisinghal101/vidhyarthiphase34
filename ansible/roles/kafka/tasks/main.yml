---
- name: Format the EBS volume if not formatted
  filesystem:
    fstype: ext4
    dev: /dev/xvdf
  become: yes

- name: Create mount directory for Kafka data
  file:
    path: "{{ kafka_data_dir }}"
    state: directory
    mode: '0755'
  become: yes

- name: Mount the EBS volume
  mount:
    path: "{{ kafka_data_dir }}"
    src: /dev/xvdf
    fstype: ext4
    state: mounted
  become: yes

- name: Create kafka group
  group:
    name: kafka
    state: present
  become: yes

- name: Create kafka user
  user:
    name: kafka
    group: kafka
    shell: /sbin/nologin
    create_home: no
    state: present
  become: yes

- name: Set permissions on Kafka data directory
  file:
    path: "{{ kafka_data_dir }}"
    owner: kafka
    group: kafka
    recurse: yes
  become: yes

- name: Download Kafka tarball
  get_url:
    url: "{{ kafka_tarball_url }}"
    dest: /tmp/kafka.tgz
    mode: '0644'

- name: Create installation directory
  file:
    path: "{{ kafka_install_dir }}"
    state: directory
    owner: kafka
    group: kafka
  become: yes

- name: Extract Kafka tarball
  unarchive:
    src: /tmp/kafka.tgz
    dest: "{{ kafka_install_dir }}"
    remote_src: yes
    extra_opts: [--strip-components=1]
    owner: kafka
    group: kafka
  become: yes

- name: Write Kafka configuration
  template:
    src: server.properties.j2
    dest: "{{ kafka_config_dir }}/kraft/server.properties"
    owner: kafka
    group: kafka
    mode: '0640'
  become: yes
  notify: restart kafka

- name: Check if storage has already been formatted
  stat:
    path: "{{ kafka_data_dir }}/meta.properties"
  register: meta_file

- name: Format Kafka storage directory with Cluster ID
  command: >
    {{ kafka_install_dir }}/bin/kafka-storage.sh format
    -t {{ kafka_cluster_id }}
    -c {{ kafka_config_dir }}/kraft/server.properties
  become: yes
  become_user: kafka
  when: not meta_file.stat.exists

- name: Create Kafka systemd service unit
  copy:
    dest: /etc/systemd/system/kafka.service
    content: |
      [Unit]
      Description=Apache Kafka Distributed Message Broker (KRaft)
      After=network.target

      [Service]
      Type=simple
      User=kafka
      Group=kafka
      Environment="KAFKA_JVM_PERFORMANCE_OPTS=-server -XX:MetaspaceSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:G1ReservePercent=15"
      ExecStart={{ kafka_install_dir }}/bin/kafka-server-start.sh {{ kafka_config_dir }}/kraft/server.properties
      ExecStop={{ kafka_install_dir }}/bin/kafka-server-stop.sh
      Restart=on-failure
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  become: yes

- name: Systemd reload and start Kafka
  systemd:
    name: kafka
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes
