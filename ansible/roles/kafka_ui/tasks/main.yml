---
- name: Install dependencies for Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  become: yes

- name: Add Docker's official GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: yes

- name: Add Docker repository
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
  become: yes

- name: Install Docker CE and compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: yes

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: Create directory for Kafka UI config
  file:
    path: /opt/kafka-ui
    state: directory
    mode: '0755'
  become: yes

- name: Write docker-compose.yml for Kafka UI
  template:
    src: docker-compose.yml.j2
    dest: /opt/kafka-ui/docker-compose.yml
    mode: '0644'
  become: yes

- name: Deploy Kafka UI via docker compose
  command: docker compose up -d
  args:
    chdir: /opt/kafka-ui
  become: yes
